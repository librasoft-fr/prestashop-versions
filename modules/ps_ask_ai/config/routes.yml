# DEV/TEST ONLY — gated behind _PS_MODE_DEV_ in the action. Persists an
# unanswered user message to a thread (orphan) so the sandbox can exercise
# orphan healing / prompt folding. Remove together with the sandbox.
ps_ask_ai_chat_test_orphan:
    path: ps-ask-ai/chat-test/orphan
    methods: [POST]
    defaults:
        _controller: 'PrestaShop\Module\PsAskAi\Controller\ChatTestController::orphanAction'

